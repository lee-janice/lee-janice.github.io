title: Man's Search for Meaning
author_first: Victor
author_last: Frankl
type: book
quotes:
    - item:
      quote: This book does not claim to be an account of facts and events but of personal experiences, experiences which millions of prisoners have suffered time and again. It is the inside story of a concentration camp, told by one of its survivors.
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 3
      notes:
      favorite:
      tags: [beginning]
    - item:
      quote: A thought transfixed me- for the first time in my life I saw the truth as it is set into song by so many poets, proclamed as the final wisdom by so many thinkers. The truth—that love is the ultimate and the highest goal to which man can aspire. Then I grapsed the meaning of the greatest secret that human poetry and human thought and belief have to impart: The salvation of man is through love and in love. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 37
      notes:
      favorite:
      tags: []
    - item:
      quote: This intensification of inner life helped the prisoner find a refuge from the emptiness, desolation and spiritual poverty of his existence, by letting him escape into the past. When given free rein, his imagination played with past events, often not important ones, but minor happenings and trifling things. His nostalgic memory glorified them and they assumed a strange character. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 39
      notes:
      favorite:
      tags: []
    - item:
      quote: Humor was another of the soul's weapons in the fight for self-preservation. It is well known that humor, more than anything else in the human make-up, can afford an aloofness and an ability to rise above any situation, even if only for a few seconds. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 43
      notes:
      favorite:
      tags: []
    - item:
      quote: To draw an analogy: a man's suffering is similar to the behavior of gas. If a certain quantity of gas is pumped into an empty chamber, it will fill the chamber completely and evenly, no matter whether the suffering is great or little. Therefore the "size" of human suffering is absolutely relative. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 44
      notes:
      favorite:
      tags: []
    - item:
      quote: In attempting this psychological presentation and a psychopathological explanation of the typical characteristics of a concentration camp inmate, I may give the impression that the human being is completely and unavoidably influenced by his surroundings... But what about human liberty? Is there no spiritual freedom in regard to behavior and reaction to any given surroundings? Is that theory true which would have us believe that man is no more than a product of many conditional and environmental factors—be they of a biological, psychological or sociological nature?... Does man have no choice of action in the face of such circumstances? 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 65
      notes:
      favorite:
      tags: []
    - item:
      quote: We who lived in concentration camps can remember the men who walked through the huts comforting others, givign away their last piece of bread. They may have been few in number, but they offer sufficient proof that everything can be taken from a man but one thing: the last of human freedoms—to choose one's attitude in any given set of circumstances, to choose one's own way. 
      description: 
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 65
      notes:
      favorite:
      tags: []
    - item:
      quote: An active life serves the purpose of giving man the opportunity to realize values in creative work, while a passive life of enjoyment affords him the opportunity to obtain fulfilllment in experiencing beauty, art, or nature. But there is also purpose in that life which is almost barren of both creation and enjoyment and which admits of but one possibility of high moral behavior: namely, in man's attitude to his existence, an existence restricted by external forces. A creative life and a life of enjoyment are banned to him. But not only creativeness and enjoyment are meaningful. If there is a meaning in life at all, then there must be a meaning in suffering. Suffering is an ineradicable part of life, even as fate and death. Without suffering and death human life cannot be complete.
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 67
      notes:
      favorite:
      tags: []
    - item:
      quote: Of the prisoners only a few kept their full inner liberty and obtained those values which their suffering afforded, but even one such example is sufficient proof that man's inner strength may raise him above his outward fate. Such men are not only in concentration camps. Everywhere man is confronted with fate, with the chance of achieving something through his own suffering.
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 68
      notes:
      favorite:
      tags: []
    - item:
      quote: A man who could not see the end of his "provisional existence" was not able to aim at an ultimate goal in life. He ceased living for the future, in contrast to a man in normal life. Therefore the whole structure of his inner life changed; signs of decay set in which we know from other areas of life.  
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 70
      notes:
      favorite:
      tags: []
    - item:
      quote: We had to learn ourselves and, furthermore, we had to teach the despairing men, that it did not realy matter what we expected from life, but rather what life expected from us. We needed to stop asking about the meaning of life, and instead to think of ourselves as those who were being questioned by life—daily and hourly. Our answer must consist, not in talk and meditation, but in right action and in right conduct. Life ultimately means taking the responsiblity to find the right answer to its problems and to fulfill the tasks which it constantly sets for each individual. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 77
      notes:
      favorite:
      tags: []
    - item:
      quote: These tasks, and therefore the meaning of life, differ from man to man, and from moment to moment. Thus it is impossible to define the meaning of life in a general way. Questions about the meaning of life can never be answered by sweeping statements. "Life" does not mean something vague, but something very real and concrete, just as life's tasks are also real and concrete. 
      description:
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 77
      notes:
      favorite:
      tags: []
    - item:
      quote: No man and no destiny can be compared with any other man or any other destiny. No situation repeats itself, and each situation calls for a different response. Sometimes the situation in which a man finds himself may require him to shape his own fate by action. At other times it is more advantageous for him to make use of an opportunity for contemplation and to realize assets in this way. Sometimes man may be required simply to accept fate, to bear his cross. Every situation is distinguished by its uniqueness, and there is always only one right answer to the problem posed by the situation at hand.
      description: 
      chapter_title: Experiences in a Concentration Camp
      chapter_number: I
      page_number: 77
      notes:
      favorite:
      tags: []

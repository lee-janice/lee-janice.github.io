      quote: "And without formulating anything clearly, I understood that I had found
          the key to Existence, the key to my Nauseas, to my own life. In fact, all that
          I could grasp beyond that returns to this fundamental absurdity. Absurdity:
          another word; I struggle against words; down there I touched the thing. But
          I wanted to fix the absolute character of this absurdity here. "
      description:

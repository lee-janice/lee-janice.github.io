    - item:
      quote: "If I love this beautiful voice it is especially because of that: it is
          neither for its fulness nor its sadness, rather because it is the event for
          which so many notes have been preparing, from so far away, dying that it might
          be born. And yet I am troubled; it would take so little to make the record stop:
          a broken spring, the whim of Cousin Adolphe. How strange it is, how moving,
          that this hardness should be so fragile. Nothing can interrupt it yet all can
          break it."
      description:

      quote: "A roquentin, they tell us, has as its primary meaning in the Larousse
          Dictionary of the Nineteenth Century: “A name formerly given to songs composed
          of fragments of other songs and linked together as in a cento, so as to produce
          bizarre effects by changes in rhythm and abrupt breaks in the succession of
          thoughts.”"
      description:
      chapter_title: A Foreword to Nausea
      chapter_number:
      progress: 0.0314136
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "Roquentin is a solipsist, trapped in a terrible echo-chamber of the self,
          haunted by the sonics of his inflamed personality. But alongside his Dostoevskyan
          anger, and his Céline-like contempt for the bourgeois masses, Roquentin is visited
          by a deeper, more philosophical ailment: he falls into bouts of what he calls
          his “Nausea.” These are episodes in which, afflicted by his sense that there
          is “absolutely no more reason for living,” he is simultaneously alienated from
          and over-immersed in reality. He is overcome in a café, in a street, in his
          study. He feels that “nothing seemed true, I felt surrounded by cardboard scenery
          which could quickly be removed. . . . I murmured: ‘Anything can happen, anything.’”
          Reality begins to lose its familiar outlines. Words, for instance, no longer
          seem to refer to their referents. "
      description:
      chapter_title: Introduction by James Wood
      chapter_number:
      progress: 0.0471204
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "Roquentin is overcome by a sense of humans as “a heap of living creatures
          . . . we hadn’t the slightest reason to be there, none of us, each one, confused,
          vaguely alarmed, felt in the way in relation to the others. In the way: it was
          the only relationship I could establish between these trees, these gates, these
          stones.” And he continues: “I, too, was In the way.” This obstructive superfluity
          does not strike him as, in some way, part of the mysterious generosity of life
          (as religionists, and even some scientists, argue that nature’s crooked abundance,
          its beautiful excess, could only come from God). Far from it. The abundance
          of life strikes him as “dismal, ailing, embarrassed at itself.”"
      description:
      chapter_title: Introduction by James Wood
      chapter_number:
      progress: 0.052356
      page_number:
      notes:
      favorite:

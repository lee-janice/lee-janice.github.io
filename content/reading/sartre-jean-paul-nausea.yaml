    - item:
      quote: "This feeling of adventure definitely does not come from events: I have
          proved it. It’s rather the way in which the moments are linked together. I think
          this is what happens: you suddenly feel that time is passing, that each instant
          leads to another, this one to another one, and so on; that each instant is annihilated,
          and that it isn’t worth while to hold it back, etc., etc. And then you attribute
          this property to events which appear to you in the instants; what belongs to
          the form you carry over to the content. You talk a lot about this amazing flow
          of time but you hardly see it. You see a woman, you think that one day she’ll
          be old, only you don’t see her grow old. But there are moments when you think
          you see her grow old and feel yourself growing old with her: this is the feeling
          of adventure."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.387435
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "I felt that the success of the enterprise was in my hands: the moment
          had an obscure meaning which had to be trimmed and perfected; certain motions
          had to be made, certain words spoken: I staggered under the weight of my responsibility.
          I stared and saw nothing, I struggled in the midst of rites which Anny invented
          on the spot and tore them to shreds with my strong arms. At those times she
          hated me.\n  Certainly, I would go to see her. I still respect and love her
          with all my heart. I hope that someone else has had better luck and skill in
          the game of perfect moments."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.418848
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "They have closets full of bottles, stuffs, old clothes, newspapers; they
          have kept everything. The past is a landlord’s luxury.\n   Where shall I keep
          mine? You don’t put your past in your pocket; you have to have a house. I have
          only my body: a man entirely alone, with his lonely body, cannot indulge in
          memories; they pass through him. I shouldn’t complain: all I wanted was to be
          free."
      description:

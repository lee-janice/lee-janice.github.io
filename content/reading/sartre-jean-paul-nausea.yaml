      tags: []
    - item:
      quote: "But faced with this great wrinkled paw, neither ignorance nor knowledge
          was important: the world of explanations and reasons is not the world of existence.
          A circle is not absurd, it is clearly explained by the rotation of a straight
          segment around one of its extremities. But neither does a circle exist. This
          root, on the other hand, existed in such a way that I could not explain it.
          Knotty, inert, nameless, it fascinated me, filled my eyes, brought me back unceasingly
          to its own existence. In vain to repeat: “This is a root”—it didn’t work any
          more. I saw clearly that you could not pass from its function as a root, as
          a breathing pump, to that, to this hard and compact skin of a sea lion, to this
          oily, callous, headstrong look. The function explained nothing: it allowed you
          to understand generally that it was a root, but not that one at all. "
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.743455
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "Suspicious: that’s what they were, the sounds, the smells, the tastes.
          When they ran quickly under your nose like startled hares and you didn’t pay
          too much attention, you might believe them to be simple and reassuring, you
          might believe that there was real blue in the world, real red, a real perfume
          of almonds or violets. But as soon as you held on to them for an instant, this
          feeling of comfort and security gave way to a deep uneasiness: colours, tastes,
          and smells were never real, never themselves and nothing but themselves."

    - item:
      quote: "“A few years ago I read a book by an American author. It was called Is
          Life Worth Living? Isn’t that the question you are asking yourself?”\n   Certainly
          not, that is not the question I am asking myself. But I have no desire to explain.\n
          “His conclusion,” the Self-Taught Man says, consolingly, “is in favour
          of voluntary optimism. Life has a meaning if we choose to give it one. One must
          first act, throw one’s self into some enterprise. Then, if one reflects, the
          die is already cast, one is pledged. I don’t know what you think about that,
          Monsieur?”\n  “Nothing,” I say.\n   Rather I think that that is precisely
          the sort of lie that the commercial traveller, the two young people and the
          man with white hair tell themselves."

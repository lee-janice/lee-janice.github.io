    - item:
      quote: "Things are bad! Things are very bad: I have it, the filth, the Nausea.
          And this time it is new: it caught me in a café. Until now cafés were my only
          refuge because they were full of people and well lighted: now there won’t even
          be that any more; when I am run to earth in my room, I shan’t know where to
          go."

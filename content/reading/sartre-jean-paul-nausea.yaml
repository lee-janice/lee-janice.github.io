    - item:
      quote: "She sings. So two of them are saved: the Jew and the Negress. Saved. Maybe
          they thought they were lost irrevocably, drowned in existence. Yet no one could
          think of me as I think of them, with such gentleness. No one, not even Anny.
          They are a little like dead people for me, a little like the heroes of a novel;
          they have washed themselves of the sin of existing. Not completely, of course,
          but as much as any man can. This idea suddenly knocks me over, because I was
          not even hoping for that any more. I feel something brush against me lightly
          and I dare not move because I am afraid it will go away. Something I didn’t
          know any more: a sort of joy.\n   The Negress sings. Can you justify your
          existence then? Just a little? "
      description:

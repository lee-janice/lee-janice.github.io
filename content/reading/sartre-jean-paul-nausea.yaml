    - item:
      quote: "Monday, 29 January, 1932:\n  Something has happened to me, I can’t
          doubt it any more. It came as an illness does, not like an ordinary certainty,
          not like anything evident. It came cunningly, little by little; I felt a little
          strange, a little put out, that’s all. Once established it never moved, it stayed
          quiet, and I was able to persuade myself that nothing was the matter with me,
          that it was a false alarm. And now, it’s blossoming."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.125654
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "I think I’m the one who has changed: that’s the simplest solution. Also
          the most unpleasant. But I must finally realize that I am subject to these sudden
          transformations. The thing is that I rarely think; a crowd of small metamorphoses
          accumulate in me without my noticing it, and then, one fine day, a veritable
          revolution takes place. This is what has given my life such a jerky, incoherent
          aspect."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.125654
      page_number:
      notes:
      favorite:
      tags: []

    - item:
      quote: "I have never had adventures. Things have happened to me, events, incidents,
          anything you like. But no adventures. It isn’t a question of words; I am beginning
          to understand. There is something to which I clung more than all the rest—without
          completely realizing it. It wasn’t love. Heaven forbid, not glory, not money.
          It was . . . I had imagined that at certain times my life could take on a rare
          and precious quality. There was no need for extraordinary circumstances: all
          I asked for was a little precision. There is nothing brilliant about my life
          now: but from time to time, for example, when they play music in the cafés,
          I look back and tell myself: in old days, in London, Meknes, Tokyo, I have known
          great moments, I have had adventures. Now I am deprived of this. I have suddenly
          learned, without any apparent reason, that I have been lying to myself for ten
          years. And naturally, everything they tell about in books can happen in real
          life, but not in the same way. It is to this way of happening that I clung so
          tightly."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.293194
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "The beginnings would have had to be real beginnings. Alas! Now I see so
          clearly what I wanted. Real beginnings are like a fanfare of trumpets, like
          the first notes of a jazz tune, cutting short tedium, making for continuity:
          then you say about these evenings within evenings: “I was out for a walk, it
          was an evening in May.” You walk, the moon has just risen, you feel lazy, vacant,
          a little empty. And then suddenly you think: “Something has happened.”"
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.293194

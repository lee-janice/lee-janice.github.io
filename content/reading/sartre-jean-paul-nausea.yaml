    - item:
      quote: "I stayed bent down for a second, I read “Dictation: The White Owl,” then
          I straightened up, empty-handed. I am no longer free, I can no longer do what
          I will.\n  Objects should not touch because they are not alive. You use them,
          put them back in place, you live among them: they are useful, nothing more.
          But they touch me, it is unbearable. I am afraid of being in contact with them
          as though they were living beasts.\n  Now I see: I recall better what I felt
          the other day at the seashore when I held the pebble. It was a sort of sweetish
          sickness. How unpleasant it was! It came from the stone, I’m sure of it, it
          passed from the stone to my hand. Yes, that’s it, that’s just it—a sort of nausea
          in the hands."
      description:

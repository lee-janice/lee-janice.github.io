    - item:
      quote: "That’s it. There are no adventures—there are no perfect moments . . .
          we have lost the same illusions, we have followed the same paths. I can guess
          the rest—I can even speak for her and tell myself all that she has left to tell:
          \n   “So you realized that there were always women in tears, or a red-headed
          man, or something else to spoil your effects?”\n   “Yes, naturally,” she answers
          without enthusiasm.\n   “Isn’t that it?”\n  “Oh, you know, I might have
          resigned myself in the end to the clumsiness of a red-headed man. After all,
          I was always interested in the way other people played their parts . . . no,
          it’s that . . .”\n   “That there are no more privileged situations?”\n
          “That’s it. I used to think that hate or love or death descended on us like
          tongues of fire on Good Friday. I thought one could radiate hate or death. What
          a mistake! Yes, I really thought that ‘Hate’ existed, that it came over people
          and raised them above themselves. Naturally, I am the only one, I am the one
          who hates, who loves. But it’s always the same thing, a piece of dough that
          gets longer and longer . . . everything looks so much alike that you wonder
          how people got the idea of inventing names, to make distinctions.”"

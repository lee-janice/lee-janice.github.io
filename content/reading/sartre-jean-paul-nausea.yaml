    - item:
      quote: "I tell her my adventures, I tell her about existence—perhaps at too great
          length. She listens carefully, her eyes wide open and her eyebrows raised.
          \n   When I finish, she looks soothed.\n   “Well, you’re not thinking like
          me at all. You complain because things don’t arrange themselves around you like
          a bouquet of flowers, without your taking the slightest trouble to do anything.
          But I have never asked as much: I wanted action. You know, when we played adventurer
          and adventuress: you were the one who had adventures, I was the one who made
          them happen. I said: I’m a man of action. Remember? Well, now I simply say:
          one can’t be a man of action.”"

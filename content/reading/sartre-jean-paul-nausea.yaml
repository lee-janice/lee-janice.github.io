    - item:
      quote: "I get up. There is a white hole in the wall, a mirror. It is a trap. I
          know I am going to let myself be caught in it. I have. The grey thing appears
          in the mirror. I go over and look at it, I can no longer get away.\n   It
          is the reflection of my face. Often in these lost days I study it. I can understand
          nothing of this face. The faces of others have some sense, some direction. Not
          mine. I cannot even decide whether it is handsome or ugly. I think it is ugly
          because I have been told so. But it doesn’t strike me. At heart, I am even shocked
          that anyone can attribute qualities of this kind to it, as if you called a clod
          of earth or a block of stone beautiful or ugly."
      description:
      chapter_title: Diary

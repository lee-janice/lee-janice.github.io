    - item:
      quote: "We forget that the future was not yet there; the man was walking in a
          night without forethought, a night which offered him a choice of dull rich prizes,
          and he did not make his choice.\n   I wanted the moments of my life to follow
          and order themselves like those of a life remembered. You might as well try
          and catch time by the tail."

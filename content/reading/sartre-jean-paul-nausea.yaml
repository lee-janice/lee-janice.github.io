    - item:
      quote: "She stares at me without seeming to see me. She is going to speak. I expect
          a tragic speech, heightened to the dignity of her mask, a funeral oration.\n
          She does not say a single word.\n   “I outlive myself.”\n   The tone
          does not correspond in any way to her face. It is not tragic, it is . . . horrible:
          it expresses a dry despair, without tears, without pity. Yes, something in her
          has irremediably dried out.\n  The masks falls, she smiles.\n   “I’m not
          at all sad. I am often amazed at it, but I was wrong: why should I be sad? I
          used to be capable of rather splendid passions. I hated my mother passionately.
          And you,” she says defiantly, “I loved you passionately.”\n  She waits for
          an answer. I say nothing.\n  “All that is over, of course.”"

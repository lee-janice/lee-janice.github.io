    - item:
      quote: "I take a few steps and stop. I savour this total oblivion into which I
          have fallen. I am between two cities, one knows nothing of me, the other knows
          me no longer. Who remembers me? Perhaps a heavy young woman in London. . . .
          And is it really of me that she thinks? Besides, there is that man, that Egyptian.
          Perhaps he has just gone into her room, perhaps he has taken her in his arms.
          I am not jealous; I know that she is outliving herself. Even if she loved him
          with all her heart, it would still be the love of a dead woman. I had her last
          living love. But there is still something he can give her: pleasure. And if
          she is fainting and sinking into enjoyment, there is nothing more which attaches
          her to me. "

    - item:
      quote: "This moment was extraordinary. I was there, motionless and icy, plunged
          in a horrible ecstasy. But something fresh had just appeared in the very heart
          of this ecstasy; I understood the Nausea, I possessed it. To tell the truth,
          I did not formulate my discoveries to myself. But I think it would be easy for
          me to put them in words now. The essential thing is contingency. I mean that
          one cannot define existence as necessity. To exist is simply to be there; those
          who exist let themselves be encountered, but you can never deduce anything from
          them. I believe there are people who have understood this. Only they tried to
          overcome this contingency by inventing a necessary, causal being. But no necessary
          being can explain existence: contingency is not a delusion, a probability which
          can be dissipated; it is the absolute, consequently, the perfect free gift. "

    - item:
      quote: "I am afraid of cities. But you mustn’t leave them. If you go too far you
          come up against the vegetation belt. Vegetation has crawled for miles towards
          the cities. It is waiting. Once the city is dead, the vegetation will cover
          it, will climb over the stones, grip them, search them, make them burst with
          its long black pincers; it will blind the holes and let its green paws hang
          over everything. You must stay in the cities as long as they are alive, you
          must never penetrate alone this great mass of hair waiting at the gates; you
          must let it undulate and crack all by itself. In the cities, if you know how
          to take care of yourself, and choose the times when all the beasts are sleeping
          in their holes and digesting, behind the heaps of organic debris, you rarely
          come across anything more than minerals, the least frightening of all existants."

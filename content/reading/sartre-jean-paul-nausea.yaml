    - item:
      quote: "Then there are words, inside the thoughts, unfinished words, a sketchy
          sentence which constantly returns: “I have to fi. . . I ex. . . Dead . . . M.
          de Roll is dead . . . I am not . . . I ex. . .” It goes, it goes . . . and there’s
          no end to it. It’s worse than the rest because I feel responsible and have complicity
          in it. For example, this sort of painful rumination: I exist, I am the one who
          keeps it up. I. The body lives by itself once it has begun. But thought—I am
          the one who continues it, unrolls it. I exist. How serpentine is this feeling
          of existing—I unwind it, slowly. . . . If I could keep myself from thinking!
          I try, and succeed: my head seems to fill with smoke . . . and then it starts
          again: “Smoke . . . not to think . . . don’t want to think . . . I think I don’t
          want to think. I mustn’t think that I don’t want to think. Because that’s still
          a thought.” Will there never be an end to it?"

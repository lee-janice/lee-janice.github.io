    - item:
      quote: "  His blue cotton shirt stands out joyfully against a chocolate-coloured
          wall. That too brings on the Nausea. The Nausea is not inside me: I feel it
          out there in the wall, in the suspenders, everywhere around me. It makes itself
          one with the café, I am the one who is within it."

    - item:
      quote: "“Well, was it especially necessary for people to be impassioned, carried
          away by hatred or love, for example; or did the exterior aspect of the event
          have to be great, I mean—what you could see of it. . . .”\n   “Both . . .
          it all depended,” she answers ungraciously.\n   “And the perfect moments?
          Where do they come in?”\n  “They came afterwards. First there are annunciatory
          signs. Then the privileged situation, slowly, majestically, comes into people’s
          lives. Then the question whether you want to make a perfect moment out of it.”
          \n   “Yes,” I say, “I understand. In each one of these privileged situations
          there are certain acts which have to be done, certain attitudes to be taken,
          words which must be said—and other attitudes, other words are strictly prohibited.
          Is that it?”\n   “I suppose so. . . .”\n  “In fact, then, the situation
          is the material: it demands exploitation.”"

      quote: "But his judgment went through me like a sword and questioned my very right
          to exist. And it was true, I had always realized it; I hadn’t the right to exist.
          I had appeared by chance, I existed like a stone, a plant or a microbe. My life
          put out feelers towards small pleasures in every direction. Sometimes it sent
          out vague signals; at other times I felt nothing more than a harmless buzzing."

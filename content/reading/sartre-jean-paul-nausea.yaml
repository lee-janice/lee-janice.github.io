    - item:
      quote: "...usually existence hides itself. It is there, around us, in us, it is us,
          you can’t say two words without mentioning it, but you can never touch it. When
          I believed I was thinking about it, I must believe that I was thinking nothing,
          my head was empty, or there was just one word in my head, the word “to be.”
          Or else I was thinking . . . how can I explain it? I was thinking of belonging,
          I was telling myself that the sea belonged to the class of green objects, or
          that the green was a part of the quality of the sea. Even when I looked at things,
          I was miles from dreaming that they existed: they looked like scenery to me.
          I picked them up in my hands, they served me as tools, I foresaw their resistance.
          But that all happened on the surface. If anyone had asked me what existence
          was, I would have answered, in good faith, that it was nothing, simply an empty
          form which was added to external things without changing anything in their nature.
          And then all of a sudden, there it was, clear as day: existence had suddenly
          unveiled itself. It had lost the harmless look of an abstract category: it was
          the very paste of things, this root was kneaded into existence. "

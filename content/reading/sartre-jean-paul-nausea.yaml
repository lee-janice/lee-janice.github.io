    - item:
      quote: "I don’t even hear it, I hear sounds, vibrations in the air which unveil
          it. It does not exist because it has nothing superfluous: it is all the rest
          which in relation to it is superfluous. It is.\n   And I, too, wanted to be.
          That is all I wanted; this is the last word. At the bottom of all these attempts
          which seemed without bonds, I find the same desire again: to drive existence
          out of me, to rid the passing moments of their fat, to twist them, dry them,
          purify myself, harden myself, to give back at last the sharp, precise sound
          of a saxophone note."

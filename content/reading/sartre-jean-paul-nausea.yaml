    - item:
      quote: "“I live in the past. I take everything that has happened to me and arrange
          it. From a distance like that, it doesn’t do any harm, you’d almost let yourself
          be caught in it. Our whole story is fairly beautiful. I give it a few prods
          and it makes a whole string of perfect moments. Then I close my eyes and try
          to imagine that I’m still living inside it. I have other characters, too. .
          . . You have to know how to concentrate. "

    - item:
      quote: "What has just happened is that the Nausea has disappeared. When the voice
          was heard in the silence, I felt my body harden and the Nausea vanish. Suddenly:
          it was almost unbearable to become so hard, so brilliant. At the same time the
          music was drawn out, dilated, swelled like a waterspout. It filled the room
          with its metallic transparency, crushing our miserable time against the walls.
          I am in the music. "
      description:

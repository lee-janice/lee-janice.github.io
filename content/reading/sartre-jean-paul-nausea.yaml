      quote: "The handsome gentleman exists, the Legion of Honour, the moustache exists,
          it is all; how happy one must be to be nothing more than a Legion of Honour
          and a moustache and no one sees the rest, he sees the two pointed ends of his
          moustache on both sides of the nose; I do not think, therefore I am a moustache.
          He sees neither his gaunt body nor his big feet, if you looked in the crotch
          of the trousers you would surely discover a pair of little balls. He has the
          Legion of Honour, the bastards have the right to exist: “I exist because it
          is my right,” I have the right to exist, therefore I have the right not to think:
          the finger is raised. "

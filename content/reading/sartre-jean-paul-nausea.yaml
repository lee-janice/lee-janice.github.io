    - item:
      quote: "Although Camus argued that after God we create our own meaning, one feels
          that he never really believed in self-determination as absolutely as
          Sartre did. Camus continued to live under a religious shadow, wherein the battle
          was always with the terms handed to us by life — a secular version of man’s
          battle with the Gods. Life was a religious sentence for Camus; he never quite
          relinquished the idea that meaning has left a residue of itself in the world.
          Sartre found Camus’s religiosity frustrating, and said so; it was, along with
          political differences, one of the reasons for the break between the two men
          in the early 1950s. Sartre, though his language is sometimes religious, never
          had any time for religion. Camus was a tragic religionist, really; Sartre was,
          as he described himself, “a providential atheist.”\n     Yet for all their
          differences, Camus and Sartre resemble each other most powerfully in the “solutions”
          they propose to the meaninglessness of existence. Roquentin thinks of writing
          a novel, and Camus tells us that we must fight life with our revolt, our freedom,
          and our passion. Are Camus’s terms really any more stringent than Sartre’s?"
      description:
      chapter_title: Introduction by James Wood
      chapter_number:
      progress: 0.0890052
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: Camus, the more religious thinker, was actually much more realistic
          about the tragic, constrained, Sisyphean nature of our ordinary daily
          imprisonment. Camus asked us to fight that imprisonment, if necessarily
          wearily and repetitively; Sartre hoped that we could simply explode the prison.

    - item:
      quote: "  I am touched, I feel my body at rest like a precision machine. I have
          had real adventures. I can recapture no detail but I perceive the rigorous succession
          of circumstances. I have crossed seas, left cities behind me, followed the course
          of rivers or plunged into forests, always making my way towards other cities.
          I have had women, I have fought with men; and never was I able to turn back,
          any more than a record can be reversed. And all that led me—where?\n   At
          this very instant, on this bench, in this translucent bubble all humming with
          music."
      description:
      chapter_title: Diary
      chapter_number:
      progress: 0.219895
      page_number:

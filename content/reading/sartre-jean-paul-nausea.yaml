    - item:
      quote: "Naturally, at first it would only be a troublesome, tiring work, it wouldn’t
          stop me from existing or feeling that I exist. But a time would come when the
          book would be written, when it would be behind me, and I think that a little
          of its clarity might fall over my past. Then, perhaps, because of it, I could
          remember my life without repugnance. Perhaps one day, thinking precisely of
          this hour, of this gloomy hour in which I wait, stooping, for it to be time
          to get on the train, perhaps I shall feel my heart beat faster and say to myself:
          “That was the day, that was the hour, when it all started.” And I might succeed—in
          the past, nothing but the past—in accepting myself."

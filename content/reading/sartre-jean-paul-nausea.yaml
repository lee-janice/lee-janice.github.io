    - item:
      quote: "”But the theatre . . .”\n   “What about the theatre? Do you want to enumerate
          all the fine arts?”\n   “Before, you used to say you wanted to act because
          on the stage you had to realize perfect moments!”\n   “Yes, I realized them:
          for the others. I was in the dust, in the draught, under raw lights, between
          cardboard sets. I usually played with Thorndyke. I think you must have seen
          him at Covent Garden. I was always afraid I’d burst out laughing in his face.”
          \n   “But weren’t you ever carried away by your part?”\n   “A little, sometimes:
          never very strongly. The essential thing, for all of us, was the black pit just
          in front of us, in the bottom of it there were people you didn’t see; obviously
          you were presenting them with a perfect moment. But, you know, they didn’t live
          in it: it unfolded in front of them. And we, the actors, do you think we lived
          inside it?”"

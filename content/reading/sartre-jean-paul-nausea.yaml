    - item:
      quote: "The Self-Taught Man laughs candidly, but his eyes stay wicked:\n   “You
          are too modest, Monsieur. In order to tolerate your condition, the human condition,
          you, as everybody else, need much courage. Monsieur, the next instant may be
          the moment of your death, you know it and you can smile: isn’t that admirable?
          In your most insignificant actions,” he adds sharply, “there is an enormous
          amount of heroism.”\n   “What will you gentlemen have for dessert?” the waitress
          says.\n  The Self-Taught Man is quite white, his eyelids are half-shut over
          his stony eyes. He makes a feeble motion with his hand, as if inviting me to
          choose.\n  “Cheese,” I say heroically."

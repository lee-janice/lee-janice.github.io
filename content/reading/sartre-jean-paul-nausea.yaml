    - item:
      quote: "If you existed, you had to exist all the way, as far as mouldiness, bloatedness,
          obscenity were concerned. In another world, circles, bars of music keep their
          pure and rigid lines. But existence is a deflection. Trees, night-blue pillars,
          the happy bubbling of a fountain, vital smells, little heat-mists floating in
          the cold air, a red-haired man digesting on a bench: all this somnolence, all
          these meals digested together, had its comic side. . . . Comic . . . no: it
          didn’t go as far as that, nothing that exists can be comic; it was like a floating
          analogy, almost entirely elusive, with certain aspects of vaudeville. "
      description:

    - item:
      quote: "“That’s it,” she says. “First you had to be plunged into something exceptional
          and feel as though you were putting it in order. If all those conditions had
          been realized, the moment would have been perfect.”\n  “In fact, it was a
          sort of work of art.”\n   “You’ve already said that,” she says with irritation.
          “No: it was . . . a duty. You had to transform privileged situations into perfect
          moments. It was a moral question. Yes, you can laugh if you like: it was moral.”
          \n   I am not laughing at all."

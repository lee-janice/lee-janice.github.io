      quote: It does not exist. It is even an annoyance; if I were to get up and
          rip this record from the table which holds it, if I were to break it in
          two, I wouldn’t reach it. It is beyond—always beyond something, a voice, a
          violin note. Through layers and layers of existence, it veils itself, thin
          and firm, and when you want to seize it, you find only existants, you butt
          against existants devoid of sense.

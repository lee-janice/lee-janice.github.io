    - item:
      quote: "I see my hand spread out on the table. It lives—it is me. It opens, the
          fingers open and point. It is lying on its back. It shows me its fat belly.
          It looks like an animal turned upside down. The fingers are the paws. I amuse
          myself by moving them very rapidly, like the claws of a crab which has fallen
          on its back.\n  The crab is dead: the claws draw up and close over the belly
          of my hand. I see the nails—the only part of me that doesn’t live. And once
          more. My hand turns over, spreads out flat on its stomach, offers me the sight
          of its back. A silvery back, shining a little—like a fish except for the red
          hairs on the knuckles. I feel my hand. I am these two beasts struggling at the
          end of my arms. My hand scratches one of its paws with the nail of the other
          paw; I feel its weight on the table which is not me. It’s long, long, this impression
          of weight, it doesn’t pass. There is no reason for it to pass. It becomes intolerable
          . . . "

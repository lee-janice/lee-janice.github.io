    - item:
      quote: "In the way: it was the only relationship I could establish between these
          trees, these gates, these stones. In vain I tried to count the chestnut trees,
          to locate them by their relationship to the Velleda, to compare their height
          with the height of the plane trees: each of them escaped the relationship in
          which I tried to enclose it, isolated itself, and overflowed. Of these relations
          (which I insisted on maintaining in order to delay the crumbling of the human
          world, measures, quantities, and directions)—I felt myself to be the arbitrator;
          they no longer had their teeth into things. In the way, the chestnut tree there,
          opposite me, a little to the left. In the way, the Velleda. . . .\n   And
          I—soft, weak, obscene, digesting, juggling with dismal thoughts—I, too, was
          In the way."
      description:

    - item:
      quote: "“The privileged situations?”\n   “The idea I had of them. They were
          situations which had a rare and precious quality, style, if you like. To be
          king, for example, when I was eight years old, seemed a privileged situation
          to me. Or to die. You may laugh, but there were so many people drawn at the
          moment of their death, and so many who spoke such sublime words at that moment
          that I quite genuinely thought . . . well, I thought that by dying you were
          transported above yourself. Besides, it was enough just to be in the room of
          a dying person: death being a privileged situation, something emanated from
          it and communicated itself to everyone there. A sort of grandeur.”"

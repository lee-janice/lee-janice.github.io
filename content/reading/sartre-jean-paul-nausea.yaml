    - item:
      quote: "She adds, in the decisive tone with which you end old quarrels:\n
          “It didn’t look at all nice on you.”\n   I don’t know what hat she’s talking
          about.\n   “Did I say it looked good on me?”\n   “I should say you did!
          You never talked of anything else. And you were always sneaking a look in the
          glass when you thought I wasn’t watching you.”\n   This knowledge of the past
          overwhelms me. Anny does not even seem to be evoking memories, her tone of voice
          does not have the touch of tender remoteness suitable to that kind of occupation.
          She seems to be speaking of today rather than yesterday; she has kept her opinions,
          her obstinacies, and her past resentments fully alive. Just the opposite for
          me, all is drowned in poetic impression; I am ready for all concessions."

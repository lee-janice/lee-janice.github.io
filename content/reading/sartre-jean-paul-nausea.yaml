    - item:
      quote: "And at that very moment, on the other side of existence, in this other
          world which you can see in the distance, but without ever approaching it, a
          little melody began to sing and dance: “You must be like me; you must suffer
          in rhythm.”\n  The voice sings:\n Some of these days\n  You’ll miss
          me, honey\n   Someone must have scratched the record at that spot because
          it makes an odd noise. And there is something that clutches the heart: the melody
          is absolutely untouched by this tiny coughing of the needle on the record. It
          is so far—so far behind. I understand that too: the disc is scratched and is
          wearing out, perhaps the singer is dead; I’m going to leave, I’m going to take
          my train. But behind the existence which falls from one present to the other,
          without a past, without a future, behind these sounds which decompose from day
          to day, peel off and slip towards death, the melody stays the same, young and
          firm, like a pitiless witness."

    - item:
      quote: "This is what I thought: for the most banal even to become an adventure,
          you must (and this is enough) begin to recount it. This is what fools people:
          a man is always a teller of tales, he lives surrounded by his stories and the
          stories of others, he sees everything that happens to him through them; and
          he tries to live his own life as if he were telling a story.\n  But you have
          to choose: live or tell. "
      description:

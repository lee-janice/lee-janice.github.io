    - item:
      quote: Oh, aren't you ashamed of yourself—aren't you ashamed? Are you really
          the sort of woman you are trying to represent yourself to be? Is it
          possible?" The prince was now addressing Nastasia, in a tone of reproach,
          which evidently came from his very heart.  Nastasia Philipovna looked
          surprised, and smiled, but evidently concealed something beneath her smile
          and with some confusion and a glance at Gania she left the room.  However,
          she had not reached the outer hall when she turned round, walked quickly
          up to Nina Alexandrovna, seized her hand and lifted it to her lips.  "He
          guessed quite right. I am not that sort of woman," she whispered
          hurriedly, flushing red all over. Then she turned again and left the room
          so quickly that no one could imagine what she had come back for. All they
          saw was that she said something to Nina Alexandrovna in a hurried whisper,
          and seemed to kiss her hand. Varia, however, both saw and heard all, and
          watched Nastasia out of the room with an expression of wonder.

      quote: "  \"Yes—yes, quite so; you are quite right. I wished to see Aglaya Ivanovna,
          you know!\" said the prince, nodding his head.  \"Oh, my dear fellow,\" cried
          Evgenie, warmly, with real sorrow in his voice, \"how could you permit all that
          to come about as it has? Of course, of course, I know it was all so unexpected.
          I admit that you, only naturally, lost your head, and—and could not stop the
          foolish girl; that was not in your power. I quite see so much; but you really
          should have understood how seriously she cared for you. She could not bear to
          share you with another; and you could bring yourself to throw away and shatter
          such a treasure! Oh, prince, prince!\"  \"Yes, yes, you are quite right again,\"\
          \ said the poor prince, in anguish of mind. \"I was wrong, I know. But it was
          only Aglaya who looked on Nastasia Philipovna so; no one else did, you know.\"\
          \  \"But that's just the worst of it all, don't you see, that there was absolutely
          nothing serious about the matter in reality!\" cried Evgenie, beside himself:
          \"Excuse me, prince, but I have thought over all this; I have thought a great
          deal over it; I know all that had happened before; I know all that took place
          six months since; and I know there was NOTHING serious about the matter, it
          was but fancy, smoke, fantasy, distorted by agitation, and only the alarmed
          jealousy of an absolutely inexperienced girl could possibly have mistaken it
          for serious reality."

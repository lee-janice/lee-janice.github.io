    - item:
      quote: Listen, Parfen; you put a question to me just now. This is my reply.
          The essence of religious feeling has nothing to do with reason, or
          atheism, or crime, or acts of any kind—it has nothing to do with these
          things—and never had. There is something besides all this, something which
          the arguments of the atheists can never touch. But the principal thing,
          and the conclusion of my argument, is that this is most clearly seen in
          the heart of a Russian.

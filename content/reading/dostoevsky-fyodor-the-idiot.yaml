    - item:
      quote: 'Cannot they understand that the more I forget myself, the more I let myself
          become attached to these last illusions of life and love, by means of which
          they try to hide from me Meyer''s wall, and all that is so plainly written on
          it—the more unhappy they make me? What is the use of all your nature to me—all
          your parks and trees, your sunsets and sunrises, your blue skies and your self-satisfied
          faces—when all this wealth of beauty and happiness begins with the fact that
          it accounts me—only me—one too many! What is the good of all this beauty and
          glory to me, when every second, every moment, I cannot but be aware that this
          little fly which buzzes around my head in the sun''s rays—even this little fly
          is a sharer and participator in all the glory of the universe, and knows its
          place and is happy in it;—while I—only I, am an outcast, and have been blind
          to the fact hitherto, thanks to my simplicity! Oh! I know well how the prince
          and others would like me, instead of indulging in all these wicked words of
          my own, to sing, to the glory and triumph of morality, that well-known verse
          of Gilbert''s:  "''O, puissent voir longtemps votre beaute sacree Tant d''amis,
          sourds a mes adieux! Qu''ils meurent pleins de jours, que leur mort soit pleuree,
          Qu''un ami leur ferme les yeux!''  "But believe me, believe me, my simple-hearted
          friends, that in this highly moral verse, in this academical blessing to the
          world in general in the French language, is hidden the intensest gall and bitterness;
          but so well concealed is the venom, that I dare say the poet actually persuaded
          himself that his words were full of the tears of pardon and peace, instead of
          the bitterness of disappointment and malice, and so died in the delusion. '

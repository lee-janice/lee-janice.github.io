      quote: "Both she and Aglaya stood and waited as though in expectation, and both
          looked at the prince like madwomen.  But he, perhaps, did not understand the
          full force of this challenge; in fact, it is certain he did not. All he could
          see was the poor despairing face which, as he had said to Aglaya, \"had pierced
          his heart for ever.\"  He could bear it no longer, and with a look of entreaty,
          mingled with reproach, he addressed Aglaya, pointing to Nastasia the while:\
          \  \"How can you?\" he murmured; \"she is so unhappy.\"  But he had no time
          to say another word before. Aglaya's terrible look bereft him of speech. In
          that look was embodied so dreadful a suffering and so deadly a hatred, that
          he gave a cry and flew to her; but it was too late. "

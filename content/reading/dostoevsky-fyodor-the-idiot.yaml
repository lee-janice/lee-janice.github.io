      quote: 'Keller confessed, with apparent sincerity, to having been guilty of many
          acts of such a nature that it astonished the prince that he could mention them,
          even to him. At every fresh avowal he professed the deepest repentance, and
          described himself as being "bathed in tears"; but this did not prevent him from
          putting on a boastful air at times, and some of his stories were so absurdly
          comical that both he and the prince laughed like madmen.  "One point in your
          favour is that you seem to have a child-like mind, and extreme truthfulness,"
          said the prince at last. "Do you know that that atones for much?"  "I am assuredly
          noble-minded, and chivalrous to a degree!" said Keller, much softened. "But,
          do you know, this nobility of mind exists in a dream, if one may put it so?
          It never appears in practice or deed. Now, why is that? I can never understand." '

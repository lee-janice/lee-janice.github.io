    - item:
      quote: "Then having bade farewell, he embarked upon those two minutes which he
          had allotted to looking into himself; he knew beforehand what he was going to
          think about. He wished to put it to himself as quickly and clearly as possible,
          that here was he, a living, thinking man, and that in three minutes he would
          be nobody; or if somebody or something, then what and where? He thought he would
          decide this question once for all in these last three minutes. A little way
          off there stood a church, and its gilded spire glittered in the sun. He remembered
          staring stubbornly at this spire, and at the rays of light sparkling from it.
          He could not tear his eyes from these rays of light; he got the idea that these
          rays were his new nature, and that in three minutes he would become one of them,
          amalgamated somehow with them. "

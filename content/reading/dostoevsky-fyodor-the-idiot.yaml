    - item:
      quote: '"If this ''Explanation'' gets into anybody''s hands, and they have patience
          to read it through, they may consider me a madman, or a schoolboy, or, more
          likely, a man condemned to die, who thought it only natural to conclude that
          all men, excepting himself, esteem life far too lightly, live it far too carelessly
          and lazily, and are, therefore, one and all, unworthy of it. Well, I affirm
          that my reader is wrong again, for my convictions have nothing to do with my
          sentence of death. Ask them, ask any one of them, or all of them, what they
          mean by happiness! Oh, you may be perfectly sure that if Columbus was happy,
          it was not after he had discovered America, but when he was discovering it!
          You may be quite sure that he reached the culminating point of his happiness
          three days before he saw the New World with his actual eyes, when his mutinous
          sailors wanted to tack about, and return to Europe! What did the New World matter
          after all? Columbus had hardly seen it when he died, and in reality he was entirely
          ignorant of what he had discovered. The important thing is life—life and nothing
          else! What is any ''discovery'' whatever compared with the incessant, eternal
          discovery of life? '

      quote: It so happened that just before he arrived I had a delightful little
          dream; one of a kind that I have hundreds of just now. I had fallen asleep
          about an hour before he came in, and dreamed that I was in some room, not
          my own. It was a large room, well furnished, with a cupboard, chest of
          drawers, sofa, and my bed, a fine wide bed covered with a silken
          counterpane. But I observed in the room a dreadful-looking creature, a
          sort of monster. It was a little like a scorpion, but was not a scorpion,
          but far more horrible, and especially so, because there are no creatures
          anything like it in nature, and because it had appeared to me for a
          purpose, and bore some mysterious signification.

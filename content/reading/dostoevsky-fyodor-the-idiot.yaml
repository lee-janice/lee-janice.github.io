    - item:
      quote: And enough of this. By the time I have got so far in the reading of
          my document the sun will be up and the huge force of his rays will be
          acting upon the living world. So be it. I shall die gazing straight at the
          great Fountain of life and power; I do not want this life!  "If I had had
          the power to prevent my own birth I should certainly never have consented
          to accept existence under such ridiculous conditions. However, I have the
          power to end my existence, although I do but give back days that are
          already numbered. It is an insignificant gift, and my revolt is equally
          insignificant.

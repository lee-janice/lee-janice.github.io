      quote: "  \"Oh, indeed! Then it is perhaps as well that I neither did invite you,
          nor do invite you now. Excuse me, prince, but we had better make this matter
          clear, once for all. We have just agreed that with regard to our relationship
          there is not much to be said, though, of course, it would have been very delightful
          to us to feel that such relationship did actually exist; therefore, perhaps—\"\
          \  \"Therefore, perhaps I had better get up and go away?\" said the prince,
          laughing merrily as he rose from his place; just as merrily as though the circumstances
          were by no means strained or difficult. \"And I give you my word, general, that
          though I know nothing whatever of manners and customs of society, and how people
          live and all that, yet I felt quite sure that this visit of mine would end exactly
          as it has ended now. Oh, well, I suppose it's all right; especially as my letter
          was not answered. Well, good-bye, and forgive me for having disturbed you!\"\
          \  The prince's expression was so good-natured at this moment, and so entirely
          free from even a suspicion of unpleasant feeling was the smile with which he
          looked at the general as he spoke, that the latter suddenly paused, and appeared
          to gaze at his guest from quite a new point of view, all in an instant.  \"\
          Do you know, prince,\" he said, in quite a different tone, \"I do not know you
          at all, yet, and after all, Elizabetha Prokofievna would very likely be pleased
          to have a peep at a man of her own name. Wait a little, if you don't mind, and
          if you have time to spare?\""

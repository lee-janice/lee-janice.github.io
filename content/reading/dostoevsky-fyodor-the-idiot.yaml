    - item:
      quote: There are terribly few honest people here, and hardly any whom one
          can respect, although people put on airs—Varia especially! Have you
          noticed, prince, how many adventurers there are nowadays? Especially here,
          in our dear Russia. How it has happened I never can understand. There used
          to be a certain amount of solidity in all things, but now what happens?
          Everything is exposed to the public gaze, veils are thrown back, every
          wound is probed by careless fingers. We are for ever present at an orgy of
          scandalous revelations.

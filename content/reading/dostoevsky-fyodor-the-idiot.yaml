    - item:
      quote: I am nearly twenty-seven years old, and yet I know I am little better
          than a child. I have no right to express my ideas, and said so long ago.
          Only in Moscow, with Rogojin, did I ever speak absolutely freely! He and I
          read Pushkin together—all his works. Rogojin knew nothing of Pushkin, had
          not even heard his name. I am always afraid of spoiling a great Thought or
          Idea by my absurd manner. I have no eloquence, I know. I always make the
          wrong gestures—inappropriate gestures—and therefore I degrade the Thought,
          and raise a laugh instead of doing my subject justice. I have no sense of
          proportion either, and that is the chief thing. I know it would be much
          better if I were always to sit still and say nothing.

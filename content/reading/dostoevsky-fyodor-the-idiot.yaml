      quote: '? And then, you would hardly believe it, but my mother—Nina Alexandrovna—helps
          Hippolyte in all sorts of ways, sends him money and clothes. She even goes as
          far as helping the children, through Hippolyte, because their mother cares nothing
          about them, and Varia does the same."  "Well, just now you said there were
          no honest nor good people about, that there were only money-grubbers—and here
          they are quite close at hand, these honest and good people, your mother and
          Varia! I think there is a good deal of moral strength in helping people in such
          circumstances."  "Varia does it from pride, and likes showing off, and giving
          herself airs. As to my mother, I really do admire her—yes, and honour her. Hippolyte,
          hardened as he is, feels it. He laughed at first, and thought it vulgar of her—but
          now, he is sometimes quite touched and overcome by her kindness. H''m! You call
          that being strong and good? I will remember that! Gania knows nothing about
          it. He would say that it was encouraging vice.'

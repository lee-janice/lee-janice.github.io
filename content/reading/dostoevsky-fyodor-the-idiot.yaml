      quote: Well, what, my dear girl? As if you can possibly like it yourself?
          The heart is the great thing, and the rest is all rubbish—though one must
          have sense as well. Perhaps sense is really the great thing. Don't smile
          like that, Aglaya. I don't contradict myself. A fool with a heart and no
          brains is just as unhappy as a fool with brains and no heart. I am one and
          you are the other, and therefore both of us suffer, both of us are
          unhappy."

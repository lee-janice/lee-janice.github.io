    - item:
      quote: Pavlicheff was a man of bright intellect and a good Christian, a
          sincere Christian," said the prince, suddenly. "How could he possibly
          embrace a faith which is unchristian? Roman Catholicism is, so to speak,
          simply the same thing as unchristianity," he added with flashing eyes,
          which seemed to take in everybody in the room.  "Come, that's a little TOO
          strong, isn't it?" murmured the old man, glancing at General Epanchin in
          surprise.  "How do you make out that the Roman Catholic religion is
          UNCHRISTIAN? What is it, then?" asked Ivan Petrovitch, turning to the
          prince.  "It is not a Christian religion, in the first place," said the
          latter, in extreme agitation, quite out of proportion to the necessity of
          the moment. "And in the second place, Roman Catholicism is, in my opinion,
          worse than Atheism itself. Yes—that is my opinion. Atheism only preaches a
          negation, but Romanism goes further; it preaches a disfigured, distorted
          Christ—it preaches Anti-Christ—I assure you, I swear it! This is my own
          personal conviction, and it has long distressed me. The Roman Catholic
          believes that the Church on earth cannot stand without universal temporal
          Power. He cries 'non possumus!' In my opinion the Roman Catholic religion
          is not a faith at all, but simply a continuation of the Roman Empire, and
          everything is subordinated to this idea—beginning with faith. The Pope has
          seized territories and an earthly throne, and has held them with the
          sword. And so the thing has gone on, only that to the sword they have
          added lying, intrigue, deceit, fanaticism, superstition, swindling;—they
          have played fast and loose with the most sacred and sincere feelings of
          men;—they have exchanged everything—everything for money, for base earthly
          POWER! And is this not the teaching of Anti-Christ? How could the upshot
          of all this be other than Atheism?

    - item:
      quote: "'I am going into the world of men. I don't know much, perhaps, but a new
          life has begun for me.' I made up my mind to be honest, and steadfast in accomplishing
          my task. Perhaps I shall meet with troubles and many disappointments, but I
          have made up my mind to be polite and sincere to everyone; more cannot be asked
          of me. People may consider me a child if they like. I am often called an idiot,
          and at one time I certainly was so ill that I was nearly as bad as an idiot;
          but I am not an idiot now. How can I possibly be so when I know myself that
          I am considered one? "

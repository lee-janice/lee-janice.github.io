    - item:
      quote: But Nastasia Philipovna seems to me to be such a SENSIBLE woman, and,
          as such, why should she run blindly into this business? That's what
          puzzles me so," said the prince.  "You don't know all, you see; I tell you
          there are things—and besides, I'm sure that she is persuaded that I love
          her to distraction, and I give you my word I have a strong suspicion that
          she loves me, too—in her own way, of course. She thinks she will be able
          to make a sort of slave of me all my life; but I shall prepare a little
          surprise for her. I don't know whether I ought to be confidential with
          you, prince; but, I assure you, you are the only decent fellow I have come
          across. I have not spoken so sincerely as I am doing at this moment for
          years. There are uncommonly few honest people about, prince; there isn't
          one honester than Ptitsin, he's the best of the lot. Are you laughing? You
          don't know, perhaps, that blackguards like honest people, and being one
          myself I like you. WHY am I a blackguard? Tell me honestly, now. They all
          call me a blackguard because of her, and I have got into the way of
          thinking myself one. That's what is so bad about the business."  "I for
          one shall never think you a blackguard again," said the prince. "I confess
          I had a poor opinion of you at first, but I have been so joyfully
          surprised about you just now; it's a good lesson for me. I shall never
          judge again without a thorough trial. I see now that you are riot only not
          a blackguard, but are not even quite spoiled. I see that you are quite an
          ordinary man, not original in the least degree, but rather weak."

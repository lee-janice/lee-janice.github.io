    - item:
      quote: This was the first time in his life that he had seen a little corner
          of what was generally known by the terrible name of "society." He had long
          thirsted, for reasons of his own, to penetrate the mysteries of the magic
          circle, and, therefore, this assemblage was of the greatest possible
          interest to him.  His first impression was one of fascination. Somehow or
          other he felt that all these people must have been born on purpose to be
          together! It seemed to him that the Epanchins were not having a party at
          all; that these people must have been here always, and that he himself was
          one of them—returned among them after a long absence, but one of them,
          naturally and indisputably.  It never struck him that all this refined
          simplicity and nobility and wit and personal dignity might possibly be no
          more than an exquisite artistic polish. The majority of the guests—who
          were somewhat empty-headed, after all, in spite of their aristocratic
          bearing—never guessed, in their self-satisfied composure, that much of
          their superiority was mere veneer, which indeed they had adopted
          unconsciously and by inheritance.  The prince would never so much as
          suspect such a thing in the delight of his first impression.

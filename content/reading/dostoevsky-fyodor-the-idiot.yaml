      quote: At the same time his grasp of things in general soon showed Totski
          that he now had to deal with a being who was outside the pale of the
          ordinary rules of traditional behaviour, and who would not only threaten
          mischief but would undoubtedly carry it out, and stop for no one.  There
          was evidently, he concluded, something at work here; some storm of the
          mind, some paroxysm of romantic anger, goodness knows against whom or
          what, some insatiable contempt—in a word, something altogether absurd and
          impossible, but at the same time most dangerous to be met with by any
          respectable person with a position in society to keep up.

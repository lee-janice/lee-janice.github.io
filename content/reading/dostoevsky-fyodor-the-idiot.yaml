    - item:
      quote: "Religion!—I admit eternal life—and perhaps I always did admit it.  \"\
          Admitted that consciousness is called into existence by the will of a Higher
          Power; admitted that this consciousness looks out upon the world and says 'I
          am;' and admitted that the Higher Power wills that the consciousness so called
          into existence, be suddenly extinguished (for so—for some unexplained reason—it
          is and must be)—still there comes the eternal question—why must I be humble
          through all this? Is it not enough that I am devoured, without my being expected
          to bless the power that devours me? Surely—surely I need not suppose that Somebody—there—will
          be offended because I do not wish to live out the fortnight allowed me? I don't
          believe it.  \"It is much simpler, and far more likely, to believe that my death
          is needed—the death of an insignificant atom—in order to fulfil the general
          harmony of the universe—in order to make even some plus or minus in the sum
          of existence. Just as every day the death of numbers of beings is necessary
          because without their annihilation the rest cannot live on—(although we must
          admit that the idea is not a particularly grand one in itself!) "

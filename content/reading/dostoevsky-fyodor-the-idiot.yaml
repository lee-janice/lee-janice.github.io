    - item:
      quote: 'Oh, it is not from vanity alone, it is not from feelings of vanity that
          Russians become Atheists and Jesuits! But from spiritual thirst, from anguish
          of longing for higher things, for dry firm land, for foothold on a fatherland
          which they never believed in because they never knew it. It is easier for a
          Russian to become an Atheist, than for any other nationality in the world. And
          not only does a Russian ''become an Atheist,'' but he actually BELIEVES IN Atheism,
          just as though he had found a new faith, not perceiving that he has pinned his
          faith to a negation. Such is our anguish of thirst! ''Whoso has no country has
          no God.'' That is not my own expression; it is the expression of a merchant,
          one of the Old Believers, whom I once met while travelling. He did not say exactly
          these words. I think his expression was:  "''Whoso forsakes his country forsakes
          his God.'''

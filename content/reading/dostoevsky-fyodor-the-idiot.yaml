    - item:
      quote: "The thought steps in, whether one likes it or no, that death is so terrible
          and so powerful, that even He who conquered it in His miracles during life was
          unable to triumph over it at the last. He who called to Lazarus, 'Lazarus, come
          forth!' and the dead man lived—He was now Himself a prey to nature and death.
          Nature appears to one, looking at this picture, as some huge, implacable, dumb
          monster; or still better—a stranger simile—some enormous mechanical engine of
          modern days which has seized and crushed and swallowed up a great and invaluable
          Being, a Being worth nature and all her laws, worth the whole earth, which was
          perhaps created merely for the sake of the advent of that Being. "

    - item:
      quote: All this filled poor Lizabetha's mind with chaotic confusion. What on
          earth did it all mean? The most disturbing feature was the hedgehog. What
          was the symbolic signification of a hedgehog? What did they understand by
          it? What underlay it? Was it a cryptic message?  Poor General Epanchin
          "put his foot in it" by answering the above questions in his own way. He
          said there was no cryptic message at all. As for the hedgehog, it was just
          a hedgehog, which meant nothing—unless, indeed, it was a pledge of
          friendship,—the sign of forgetting of offences and so on. At all events,
          it was a joke, and, of course, a most pardonable and innocent one.  We may
          as well remark that the general had guessed perfectly accurately.

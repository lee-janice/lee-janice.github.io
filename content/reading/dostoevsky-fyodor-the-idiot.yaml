    - item:
      quote: A few moments later, the prince was seated by Nastasia on the sofa,
          gazing into her eyes and stroking her face and hair, as he would a little
          child's. He laughed when she laughed, and was ready to cry when she cried.
          He did not speak, but listened to her excited, disconnected chatter,
          hardly understanding a word of it the while. No sooner did he detect the
          slightest appearance of complaining, or weeping, or reproaching, than he
          would smile at her kindly, and begin stroking her hair and her cheeks,
          soothing and consoling her once more, as if she were a child.

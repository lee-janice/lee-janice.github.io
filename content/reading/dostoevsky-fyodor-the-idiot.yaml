      quote: However—admit the fact! Admit that without such perpetual devouring
          of one another the world cannot continue to exist, or could never have
          been organized—I am ever ready to confess that I cannot understand why
          this is so—but I'll tell you what I DO know, for certain. If I have once
          been given to understand and realize that I AM—what does it matter to me
          that the world is organized on a system full of errors and that otherwise
          it cannot be organized at all? Who will or can judge me after this? Say
          what you like—the thing is impossible and unjust!  "And meanwhile I have
          never been able, in spite of my great desire to do so, to persuade myself
          that there is no future existence, and no Providence.

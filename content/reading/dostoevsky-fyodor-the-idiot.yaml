    - item:
      quote: This confidence of a stupid man in his own talents has been
          wonderfully depicted by Gogol in the amazing character of Pirogoff.
          Pirogoff has not the slightest doubt of his own genius,—nay, of his
          SUPERIORITY of genius,—so certain is he of it that he never questions it.
          How many Pirogoffs have there not been among our writers—scholars,
          propagandists? I say "have been," but indeed there are plenty of them at
          this very day.  Our friend, Gania, belonged to the other class—to the
          "much cleverer" persons, though he was from head to foot permeated and
          saturated with the longing to be original. This class, as I have said
          above, is far less happy. For the "clever commonplace" person, though he
          may possibly imagine himself a man of genius and originality, none the
          less has within his heart the deathless worm of suspicion and doubt; and
          this doubt sometimes brings a clever man to despair. (As a rule, however,
          nothing tragic happens;—his liver becomes a little damaged in the course
          of time, nothing more serious. Such men do not give up their aspirations
          after originality without a severe struggle,—and there have been men who,
          though good fellows in themselves, and even benefactors to humanity, have
          sunk to the level of base criminals for the sake of originality).  Gania
          was a beginner, as it were, upon this road. A deep and unchangeable
          consciousness of his own lack of talent, combined with a vast longing to
          be able to persuade himself that he was original, had rankled in his
          heart, even from childhood.

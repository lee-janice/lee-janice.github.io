    - item:
      quote: "Yes, but the prince told us about the donkey very cleverly, all the same,\"\
          \ said Alexandra. \"I have always been most interested to hear how people go
          mad and get well again, and that sort of thing. Especially when it happens suddenly.\"\
          \  \"Quite so, quite so!\" cried Mrs. Epanchin, delighted. \"I see you CAN be
          sensible now and then, Alexandra. You were speaking of Switzerland, prince?\"\
          \  \"Yes. We came to Lucerne, and I was taken out in a boat. I felt how lovely
          it was, but the loveliness weighed upon me somehow or other, and made me feel
          melancholy.\"  \"Why?\" asked Alexandra.  \"I don't know; I always feel like
          that when I look at the beauties of nature for the first time; but then, I was
          ill at that time, of course!\" "

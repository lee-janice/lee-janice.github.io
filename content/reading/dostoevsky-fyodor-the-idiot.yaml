    - item:
      quote: Nastasia Philipovna was quite capable of ruining herself, and even of
          perpetrating something which would send her to Siberia, for the mere
          pleasure of injuring a man for whom she had developed so inhuman a sense
          of loathing and contempt. He had sufficient insight to understand that she
          valued nothing in the world—herself least of all—and he made no attempt to
          conceal the fact that he was a coward in some respects. For instance, if
          he had been told that he would be stabbed at the altar, or publicly
          insulted, he would undoubtedly have been frightened; but not so much at
          the idea of being murdered, or wounded, or insulted, as at the thought
          that if such things were to happen he would be made to look ridiculous in
          the eyes of society.

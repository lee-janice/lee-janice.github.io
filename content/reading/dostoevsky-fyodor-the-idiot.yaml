    - item:
      quote: "These letters, too, were like a dream. We sometimes have strange, impossible
          dreams, contrary to all the laws of nature. When we awake we remember them and
          wonder at their strangeness. You remember, perhaps, that you were in full possession
          of your reason during this succession of fantastic images; even that you acted
          with extraordinary logic and cunning while surrounded by murderers who hid their
          intentions and made great demonstrations of friendship, while waiting for an
          opportunity to cut your throat. You remember how you escaped them by some ingenious
          stratagem; then you doubted if they were really deceived, or whether they were
          only pretending not to know your hiding-place; then you thought of another plan
          and hoodwinked them once again. You remember all this quite clearly, but how
          is it that your reason calmly accepted all the manifest absurdities and impossibilities
          that crowded into your dream? One of the murderers suddenly changed into a woman
          before your very eyes; then the woman was transformed into a hideous, cunning
          little dwarf; and you believed it, and accepted it all almost as a matter of
          course—while at the same time your intelligence seemed unusually keen, and accomplished
          miracles of cunning, sagacity, and logic! Why is it that when you awake to the
          world of realities you nearly always feel, sometimes very vividly, that the
          vanished dream has carried with it some enigma which you have failed to solve?
          You smile at the extravagance of your dream, and yet you feel that this tissue
          of absurdity contained some real idea, something that belongs to your true life,—something
          that exists, and has always existed, in your heart. You search your dream for
          some prophecy that you were expecting. It has left a deep impression upon you,
          joyful or cruel, but what it means, or what has been predicted to you in it,
          you can neither understand nor remember. "

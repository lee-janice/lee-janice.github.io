      quote: though I was not altogether without reason at such times, yet I had
          no logical power of thought. This would continue for three or four days,
          and then I would recover myself again. I remember my melancholy was
          intolerable; I felt inclined to cry; I sat and wondered and wondered
          uncomfortably; the consciousness that everything was strange weighed
          terribly upon me; I could understand that it was all foreign and strange.
          I recollect I awoke from this state for the first time at Basle, one
          evening; the bray of a donkey aroused me, a donkey in the town market. I
          saw the donkey and was extremely pleased with it, and from that moment my
          head seemed to clear."  "A donkey? How strange! Yet it is not strange.
          Anyone of us might fall in love with a donkey! It happened in mythological
          times," said Madame Epanchin, looking wrathfully at her daughters, who had
          begun to laugh. "Go on, prince."  "Since that evening I have been
          specially fond of donkeys. I began to ask questions about them, for I had
          never seen one before; and I at once came to the conclusion that this must
          be one of the most useful of animals—strong, willing, patient, cheap; and,
          thanks to this donkey, I began to like the whole country I was travelling
          through; and my melancholy passed away."  "All this is very strange and
          interesting," said Mrs. Epanchin. "Now let's leave the donkey and go on to
          other matters. What are you laughing at, Aglaya? and you too, Adelaida?
          The prince told us his experiences very cleverly; he saw the donkey
          himself, and what have you ever seen? YOU have never been abroad."

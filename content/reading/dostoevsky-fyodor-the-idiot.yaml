    - item:
      quote: "What were they afraid of? One can tell a child everything, anything. I
          have often been struck by the fact that parents know their children so little.
          They should not conceal so much from them. How well even little children understand
          that their parents conceal things from them, because they consider them too
          young to understand! Children are capable of giving advice in the most important
          matters. How can one deceive these dear little birds, when they look at one
          so sweetly and confidingly? I call them birds because there is nothing in the
          world better than birds! "

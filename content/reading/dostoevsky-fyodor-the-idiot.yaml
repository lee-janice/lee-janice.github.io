    - item:
      quote: It is not such a very dreadful circumstance that we are odd people,
          is it? For we really are odd, you know—careless, reckless, easily wearied
          of anything. We don't look thoroughly into matters—don't care to
          understand things. We are all like this—you and I, and all of them! Why,
          here are you, now—you are not a bit angry with me for calling you odd,'
          are you? And, if so, surely there is good material in you? Do you know, I
          sometimes think it is a good thing to be odd. We can forgive one another
          more easily, and be more humble.

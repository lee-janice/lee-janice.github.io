      quote: All this is pure philosophy," said Adelaida. "You are a philosopher,
          prince, and have come here to instruct us in your views."  "Perhaps you
          are right," said the prince, smiling. "I think I am a philosopher,
          perhaps, and who knows, perhaps I do wish to teach my views of things to
          those I meet with?"  "Your philosophy is rather like that of an old woman
          we know, who is rich and yet does nothing but try how little she can
          spend. She talks of nothing but money all day. Your great philosophical
          idea of a grand life in a prison and your four happy years in that Swiss
          village are like this, rather," said Aglaya.

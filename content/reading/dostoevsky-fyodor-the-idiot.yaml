    - item:
      quote: I want to be brave, and be afraid of nobody. I don't want to go to
          their balls and things—I want to do good. I have long desired to run away,
          for I have been kept shut up for twenty years, and they are always trying
          to marry me off. I wanted to run away when I was fourteen years old—I was
          a little fool then, I know—but now I have worked it all out, and I have
          waited for you to tell me about foreign countries. I have never seen a
          single Gothic cathedral. I must go to Rome; I must see all the museums; I
          must study in Paris. All this last year I have been preparing and reading
          forbidden books. Alexandra and Adelaida are allowed to read anything they
          like, but I mayn't. I don't want to quarrel with my sisters, but I told my
          parents long ago that I wish to change my social position. I have decided
          to take up teaching, and I count on you because you said you loved
          children. Can we go in for education together—if not at once, then
          afterwards? We could do good together. I won't be a general's daughter any
          more!

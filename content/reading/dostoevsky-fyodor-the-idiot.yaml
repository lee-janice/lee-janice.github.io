      quote: Listen," she began again; "I have long waited to tell you all this,
          ever since the time when you sent me that letter—even before that. Half of
          what I have to say you heard yesterday. I consider you the most honest and
          upright of men—more honest and upright than any other man; and if anybody
          says that your mind is—is sometimes affected, you know—it is unfair. I
          always say so and uphold it, because even if your surface mind be a little
          affected (of course you will not feel angry with me for talking so—I am
          speaking from a higher point of view) yet your real mind is far better
          than all theirs put together. Such a mind as they have never even DREAMED
          of; because really, there are TWO minds—the kind that matters, and the
          kind that doesn't matter. Isn't it so?"  "May be! may be so!" said the
          prince, faintly; his heart was beating painfully.

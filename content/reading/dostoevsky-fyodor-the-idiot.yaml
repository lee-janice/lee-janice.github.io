      quote: 'it was then that I became so restless. Sometimes I went and climbed the
          mountain and stood there in the midst of the tall pines, all alone in the terrible
          silence, with our little village in the distance, and the sky so blue, and the
          sun so bright, and an old ruined castle on the mountain-side, far away. I used
          to watch the line where earth and sky met, and longed to go and seek there the
          key of all mysteries, thinking that I might find there a new life, perhaps some
          great city where life should be grander and richer—and then it struck me that
          life may be grand enough even in a prison." '

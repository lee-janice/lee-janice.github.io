      quote: I'll tell you why I draw the conclusion," explained the prince,
          evidently desirous of clearing up the matter a little. "Because, though I
          often think over the men of those times, I cannot for the life of me
          imagine them to be like ourselves. It really appears to me that they were
          of another race altogether than ourselves of today. At that time people
          seemed to stick so to one idea; now, they are more nervous, more
          sensitive, more enlightened—people of two or three ideas at once—as it
          were. The man of today is a broader man, so to speak—and I declare I
          believe that is what prevents him from being so self-contained and
          independent a being as his brother of those earlier days. Of course my
          remark was only made under this impression, and not in the least—

      quote: "\"I am surprised to see you laugh in that way, like a child. You came
          to make friends with me again just now, and you said, 'I will kiss your hand,
          if you like,' just as a child would have said it. And then, all at once you
          are talking of this mad project—of these seventy-five thousand roubles! It all
          seems so absurd and impossible.\"  \"Well, what conclusion have you reached?\"\
          \  \"That you are rushing madly into the undertaking, and that you would do
          well to think it over again. It is more than possible that Varvara Ardalionovna
          is right.\"  \"Ah! now you begin to moralize! I know that I am only a child,
          very well,\" replied Gania impatiently. \"That is proved by my having this conversation

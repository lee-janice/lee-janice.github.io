      quote: When I arose to lock the door after him, I suddenly called to mind a
          picture I had noticed at Rogojin's in one of his gloomiest rooms, over the
          door. He had pointed it out to me himself as we walked past it, and I
          believe I must have stood a good five minutes in front of it. There was
          nothing artistic about it, but the picture made me feel strangely
          uncomfortable. It represented Christ just taken down from the cross. It
          seems to me that painters as a rule represent the Saviour, both on the
          cross and taken down from it, with great beauty still upon His face. This
          marvellous beauty they strive to preserve even in His moments of deepest
          agony and passion. But there was no such beauty in Rogojin's picture. This
          was the presentment of a poor mangled body which had evidently suffered
          unbearable anguish even before its crucifixion, full of wounds and
          bruises, marks of the violence of soldiers and people, and of the
          bitterness of the moment when He had fallen with the cross—all this
          combined with the anguish of the actual crucifixion.  "The face was
          depicted as though still suffering; as though the body, only just dead,
          was still almost quivering with agony. The picture was one of pure nature,
          for the face was not beautified by the artist, but was left as it would
          naturally be, whosoever the sufferer, after such anguish.

      quote: You could not love him because you are too proud—no, not proud, that
          is an error; because you are too vain—no, not quite that either; too
          self-loving; you are self-loving to madness. Your letters to me are a
          proof of it. You could not love so simple a soul as his, and perhaps in
          your heart you despised him and laughed at him. All you could love was
          your shame and the perpetual thought that you were disgraced and insulted.
          If you were less shameful, or had no cause at all for shame, you would be
          still more unhappy than you are now.

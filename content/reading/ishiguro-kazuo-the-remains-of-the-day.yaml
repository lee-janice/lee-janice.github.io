    - item:
      quote: "It needs to be said too what salacious nonsense it is to claim that
          Lord Darlington was anti-Semitic, or that he had close association with organizations
          like the British Union of Fascists. Such claims can only arise from complete
          ignorance of the sort of gentleman his lordship was. Lord Darlington came to
          abhor anti-Semitism; I heard him express his disgust on several separate occasions
          when confronted with anti-Semitic sentiments. And the allegation that his lordship
          never allowed Jewish people to enter the house or any Jewish staff to be employed
          is utterly unfounded – except, perhaps, in respect to one very minor episode
          in the thirties which has been blown up out of all proportion."
      description:

    - item:
      quote: "Naturally – and why should I not admit this – I have occasionally wondered
          to myself how things might have turned out in the long run had I not been so
          determined over the issue of our evening meetings; that is to say, had I relented
          on those several occasions over the weeks that followed when Miss Kenton suggested
          we reinstitute them. I only speculate over this now because in the light of
          subsequent events, it could well be argued that in making my decision to end
          those evening meetings once and for all, I was perhaps not entirely aware of
          the full implications of what I was doing. Indeed, it might even be said that
          this small decision of mine constituted something of a key turning point; that
          that decision set things on an inevitable course towards what eventually happened.\n\
          \ But then, I suppose, when with the benefit of hindsight one begins to search
          one’s past for such ‘turning points’, one is apt to start seeing them everywhere."
      description:
      chapter_title: "Chapter 5 - Day Three · Evening: Moscombe, near Tavistock, Devon"
      chapter_number:
      progress: 0.7094972067039106
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "I made my exit, and it was not until after I had done so that it occurred
          to me I had not actually offered her my condolences. I could well imagine the
          blow the news would be to her, her aunt having been, to all intents and purposes,
          like a mother to her, and I paused out in the corridor, wondering if I should
          go back, knock and make good my omission. But then it occurred to me that if
          I were to do so, I might easily intrude upon her private grief. Indeed, it was
          not impossible that Miss Kenton, at that very moment, and only a few feet from
          me, was actually crying. The thought provoked a strange feeling to rise within
          me, causing me to stand there hovering in the corridor for some moments."
      description:
      chapter_title: "Chapter 5 - Day Three · Evening: Moscombe, near Tavistock, Devon"
      chapter_number:
      progress: 0.7094972067039106

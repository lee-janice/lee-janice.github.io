    - item:
      quote: "I remember coming here years ago, and there was this American chap here.
          We were having a big conference, my father was involved in organizing it. I
          remember this American chap, even drunker than I am now, he got up at the dinner
          table in front of the whole company. And he pointed at his lordship and called
          him an amateur. Called him a bungling amateur and said he was out of his depth.
          Well, I have to say, Stevens, that American chap was quite right. It’s a fact
          of life. Today’s world is too foul a place for fine and noble instincts. You’ve
          seen it yourself, haven’t you, Stevens? The way they’ve manipulated something
          fine and noble. You’ve seen it yourself, haven’t you?’\n ‘I’m sorry, sir, but
          I can’t say I have."

    - item:
      quote: "...on their own terms, his statements were, surely, far too idealistic, far
          too theoretical, to deserve respect. Up to a point, no doubt, there is some
          truth in what he says: in a country such as ours, people may indeed have a certain
          duty to think about great affairs and form their opinions. But life being what
          it is, how can ordinary people truly be expected to have ‘strong opinions’ on
          all manner of things – as Mr Harry Smith rather fancifully claims the villagers
          here do? And not only are these expectations unrealistic, I rather doubt if
          they are even desirable. There is, after all, a real limit to how much ordinary
          people can learn and know, and to demand that each and every one of them contribute
          ‘strong opinions’ to the great debates of the nation cannot, surely, be wise.
          It is, in any case, absurd that anyone should presume to define a person’s ‘dignity’
          in these terms."

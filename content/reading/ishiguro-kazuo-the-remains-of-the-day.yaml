    - item:
      quote: "It occurs to me in recalling these words that, of course, many of Lord
          Darlington’s ideas will seem today rather odd – even, at times, unattractive.
          But surely it cannot be denied that there is an important element of truth in
          these things he said to me that morning in the billiard room. Of course, it
          is quite absurd to expect any butler to be in a position to answer authoritatively
          questions of the sort Mr Spencer had put to me that night, and the claim of
          people like Mr Harry Smith that one’s ‘dignity’ is conditional on being able
          to do so can be seen for the nonsense it is. Let us establish this quite clearly:
          a butler’s duty is to provide good service. It is not to meddle in the great
          affairs of the nation. "

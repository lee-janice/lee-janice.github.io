    - item:
      quote: "He went on looking at his hands for a moment. Then he said slowly: ‘I
          hope I’ve been a good father to you.’\n I laughed a little and said: ‘I’m so
          glad you’re feeling better now.’\n ‘I’m proud of you. A good son. I hope I’ve
          been a good father to you. I suppose I haven’t.’\n ‘I’m afraid we’re extremely
          busy now, but we can talk again in the morning.’\n My father was still looking
          at his hands as though he were faintly irritated by them.\n ‘I’m so glad you’re
          feeling better now,’ I said again and took my leave."

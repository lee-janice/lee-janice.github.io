    - item:
      quote: "Then she continued in a tired voice: ‘It was cowardice, Mr Stevens. Simple
          cowardice. Where could I have gone? I have no family. Only my aunt. I love her
          dearly, but I can’t live with her for a day without feeling my whole life is
          wasting away. I did tell myself, of course, I would soon find some new situation.
          But I was so frightened, Mr Stevens. Whenever I thought of leaving, I just saw
          myself going out there and finding nobody who knew or cared about me. There,
          that’s all my high principles amount to. I feel so ashamed of myself. But I
          just couldn’t leave, Mr Stevens. I just couldn’t bring myself to leave."

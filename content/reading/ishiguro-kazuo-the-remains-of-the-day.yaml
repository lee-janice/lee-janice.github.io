    - item:
      quote: Then she was standing before me, and suddenly the atmosphere
          underwent a peculiar change – almost as though the two of us had been
          suddenly thrust on to some other plane of being altogether. I am afraid it
          is not easy to describe clearly what I mean here. All I can say is that
          everything around us suddenly became very still; it was my impression that
          Miss Kenton’s manner also underwent a sudden change; there was a strange
          seriousness in her expression, and it struck me she seemed almost
          frightened.

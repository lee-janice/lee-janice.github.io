    - item:
      quote: There will always be, I realize, those who would claim that any
          attempt to analyse greatness as I have been doing is quite futile. ‘You
          know when somebody’s got it and you know when somebody hasn’t,’ Mr
          Graham’s argument would always be. ‘Beyond that there’s nothing much you
          can say.
      description:

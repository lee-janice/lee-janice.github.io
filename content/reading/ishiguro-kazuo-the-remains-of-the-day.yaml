    - item:
      quote: I mean to say, Stevens, this is a genuine grand old English house,
          isn’t it? That’s what I paid for. And you’re a genuine old-fashioned
          English butler, not just some waiter pretending to be one. You’re the real
          thing, aren’t you? That’s what I wanted, isn’t that what I have?

    - item:
      quote: "I believe I realized even at the time that my explanation to Mr Farraday
          – though, of course, not entirely devoid of truth – was woefully inadequate.
          But when one has so much else to think about, it is easy not to give such matters
          a great deal of attention, and so I did, indeed, put the whole episode out of
          my mind for some time. But now, recalling it here in the calm that surrounds
          this pond, there seems little doubt that my conduct towards Mrs Wakefield that
          day has an obvious relation to what has just taken place this afternoon."
      description:

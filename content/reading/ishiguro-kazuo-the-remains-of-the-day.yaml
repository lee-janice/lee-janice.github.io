    - item:
      quote: "I do not think I responded immediately, for it took me a moment or two
          to fully digest these words of Miss Kenton. Moreover, as you might appreciate,
          their implications were such as to provoke a certain degree of sorrow within
          me. Indeed – why should I not admit it? – at that moment, my heart was breaking.
          Before long, however, I turned to her and said with a smile:\n ‘You’re very
          correct, Mrs Benn. As you say, it is too late to turn back the clock. Indeed,
          I would not be able to rest if I thought such ideas were the cause of unhappiness
          for you and your husband. We must each of us, as you point out, be grateful
          for what we do have. And from what you tell me, Mrs Benn, you have reason to
          be contented. In fact, I would venture, what with Mr Benn retiring, and with
          grandchildren on the way, that you and Mr Benn have some extremely happy years
          before you. You really mustn’t let any more foolish ideas come between yourself
          and the happiness you deserve.’\n ‘Of course, you’re right, Mr Stevens. You’re
          so kind.’\n ‘Ah, Mrs Benn, that appears to be the bus coming now."

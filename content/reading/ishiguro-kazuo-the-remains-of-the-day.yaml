    #       into practice, and one will see that their careers – and in some cases they
    #       were highly promising careers – came to nothing as a direct consequence. I personally
    #       knew at least two professionals, both of some ability, who went from one employer
    #       to the next, forever dissatisfied, never settling anywhere, until they drifted
    #       from view altogether. That this should happen is not in the least surprising.
    #       For it is, in practice, simply not possible to adopt such a critical attitude
    #       towards an employer and at the same time provide good service. It is not simply

    - item:
      quote: As we continued to talk, I must say I thought I began to notice
          further, more subtle changes which the years had wrought on her. For
          instance, Miss Kenton appeared, somehow, slower. It is possible this was
          simply the calmness that comes with age, and I did try hard for some time
          to see it as such. But I could not escape the feeling that what I was
          really seeing was a weariness with life; the spark which had once made her
          such a lively, and at times volatile person seemed now to have gone. In
          fact, every now and then, when she was not speaking, when her face was in
          repose, I thought I glimpsed something like sadness in her expression. But
          then again, I may well have been mistaken about this.

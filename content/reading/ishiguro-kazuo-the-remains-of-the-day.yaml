    - item:
      quote: But when I say this, I do not mean to imply the stance I took over
          the matter of the book that evening was somehow unwarranted. For you must
          understand, there was an important principle at issue. The fact was, I had
          been ‘off duty’ at that moment Miss Kenton had come marching into my
          pantry. And of course, any butler who regards his vocation with pride, any
          butler who aspires at all to a ‘dignity in keeping with his position’, as
          the Hayes Society once put it, should never allow himself to be ‘off duty’
          in the presence of others. It really was immaterial whether it was Miss
          Kenton or a complete stranger who had walked in at that moment. A butler
          of any quality must be seen to inhabit his role, utterly and fully; he
          cannot be seen casting it aside one moment simply to don it again the next
          as though it were nothing more than a pantomime costume. There is one
          situation and one situation only in which a butler who cares about his
          dignity may feel free to unburden himself of his role; that is to say,
          when he is entirely alone. You will appreciate then that in the event of
          Miss Kenton bursting in at a time when I had presumed, not unreasonably,
          that I was to be alone, it came to be a crucial matter of principle, a
          matter indeed of dignity, that I did not appear in anything less than my
          full and proper role.

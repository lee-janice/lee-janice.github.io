    - item:
      quote: "\n Dr Carlisle nodded, but seemed to have become immersed in his own thoughts.
          ‘You know, Mr Stevens,’ he said, eventually, ‘when I first came out here, I
          was a committed socialist. Believed in the best services for all the people
          and all the rest of it. First came here in ‘forty-nine. Socialism would allow
          people to live with dignity. That’s what I believed when I came out here. Sorry,
          you don’t want to hear all this rot.’ He turned to me cheerily. ‘What about
          you, old chap?’\n ‘I’m sorry, sir?’\n ‘What do you think dignity’s all about?’\n\
          \ The directness of this inquiry did, I admit, take me rather by surprise. ‘It’s
          rather a hard thing to explain in a few words, sir,’ I said. ‘But I suspect
          it comes down to not removing one’s clothing in public’.\n ‘Sorry. What does?’\n\
          \ ‘Dignity, sir.’\n ‘Ah.’ The doctor nodded, but looked a little bemused."

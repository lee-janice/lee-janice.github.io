    - item:
      quote: Errors such as these which have occurred over the last few months
          have been, naturally enough, injurious to one’s self-respect, but then
          there is no reason to believe them to be the signs of anything more
          sinister than a staff shortage. Not that a staff shortage is not
          significant in itself; but if Miss Kenton were indeed to return to
          Darlington Hall, such little slips, I am sure, would become a thing of the
          past. Of course, one has to remember there is nothing stated specifically
          in Miss Kenton’s letter – which, incidentally, I reread last night up in
          my room before putting out the light – to indicate unambiguously her
          desire to return to her former position. In fact, one has to accept the
          distinct possibility that one may have previously – perhaps through
          wishful thinking of a professional kind – exaggerated what evidence there
          was regarding such a desire on her part. For I must say I was a little
          surprised last night at how difficult it was actually to point to any
          passage which clearly demonstrated her wish to return.

    - item:
      quote: "‘I don’t agree with many things Mr Churchill says.’ Mr Harry Smith said,
          ‘but there’s no doubt about it, he’s a great man. It must be quite something,
          sir, to be discussing matters with his like.’\n ‘Well, I must reiterate,’ I
          said, ‘I didn’t have a great deal to do with Mr Churchill. But as you rightly
          point out, it’s rather gratifying to have consorted with him. In fact, all in
          all, I suppose I have been very fortunate, I would be the first to admit that.
          It has been my good fortune, after all, to have consorted not just with Mr Churchill,
          but with many other great leaders and men of influence – from America and from
          Europe. And when you think that it was my good fortune to have had their ear
          on many great issues of the day, yes, when I think back, I do feel a certain
          gratitude. It’s a great privilege, after all, to have been given a part to play,
          however small, on the world’s stage."

      quote: "My good fellow, please come to our assistance. What was M. Laval really
          intending, by his recent speech on the situation in North Africa? Are you also
          of the view that it was simply a ruse to scupper the nationalist fringe of his
          own domestic party?’\n ‘I’m sorry, sir, but I am unable to assist in this matter.’\n\
          \ ‘You see, gentlemen,’ Mr Spencer said, turning to the others, ‘our man here
          is unable to assist us in these matters.’\n This brought fresh laughter, now
          barely suppressed.\n ‘And yet,’ Mr Spencer went on, ‘we still persist with the
          notion that this nation’s decisions be left in the hands of our good man here
          and to the few million others like him. Is it any wonder, saddled as we are
          with our present parliamentary system, that we are unable to find any solution
          to our many difficulties? Why, you may as well ask a committee of the mothers’
          union to organize a war campaign."

    - item:
      quote: "His lordship is a dear, dear man. But the fact is, he is out of his depth.
          He is being manoeuvred. The Nazis are manoeuvring him like a pawn. Have you
          noticed this, Stevens? Have you noticed this is what has been happening for
          the last three or four years at least?’\n ‘I’m sorry, sir, I have failed to
          notice any such development.’\n ‘Haven’t you even had a suspicion? The smallest
          suspicion that Herr Hitler, through our dear friend Herr Ribbentrop, has been
          manoeuvring his lordship like a pawn, just as easily as he manoeuvres any of
          his other pawns back in Berlin?’\n ‘I’m sorry, sir, I’m afraid I have not noticed
          any such development.’\n ‘But I suppose you wouldn’t, Stevens, because you’re
          not curious. You just let all this go on before you and you never think to look
          at it for what it is.’\n Mr Cardinal adjusted his position in the armchair so
          that he was a little more upright, and for a moment he seemed to be contemplating
          his unfinished work on the desk near by. Then he said:\n ‘His lordship is a
          gentleman. That’s what’s at the root of it. He’s a gentleman, and he fought
          a war with the Germans, and it’s his instinct to offer generosity and friendship
          to a defeated foe. It’s his instinct. Because he’s a gentleman, a true old English
          gentleman. And you must have seen it, Stevens. How could you not have seen it?
          The way they’ve used it, manipulated it, turned something fine and noble into
          something else – something they can use for their own foul ends? You must have
          seen it, Stevens."

    - item:
      quote: Mind you,’ put in Mr Harry Smith, ‘with all respect for what you say,
          sir, it ought to be said. Dignity isn’t just something gentlemen have.
          Dignity’s something every man and woman in this country can strive for and
          get. You’ll excuse me, sir, but like I said before, we don’t stand on
          ceremony here when it comes to expressing opinions. And that’s my opinion
          for what it’s worth. Dignity’s not just something for gentlemen.

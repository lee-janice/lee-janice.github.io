    - item:
      quote: "Mr Morgan, who had said little since his arrival, bent forward and said
          to me: ‘What do you suppose it is, sir? Maybe one that’s got it can better say
          what it is. Here we are all talking about who’s got it and who hasn’t, and we’re
          none the wiser about what we’re talking about. Perhaps you could enlighten us
          a bit, sir.’\n A silence fell around the table and I could sense all the faces
          turn to me. I gave a small cough and said:\n ‘It is hardly for me to pronounce
          upon qualities I may or may not possess. However, as far as this particular
          question is concerned, one would suspect that the quality being referred to
          might be most usefully termed “dignity”.’"

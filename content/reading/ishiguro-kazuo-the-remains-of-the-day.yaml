    - item:
      quote: "However, if a butler is to be of any worth to anything or anybody in life,
          there must surely come a time when he ceases his searching; a time when he must
          say to himself: ‘This employer embodies all that I find noble and admirable.
          I will hereafter devote myself to serving him.’ This is loyalty intelligently
          bestowed. What is there ‘undignified’ in this? One is simply accepting an inescapable
          truth: that the likes of you and I will never be in a position to comprehend
          the great affairs of today’s world, and our best course will always be to put
          our trust in an employer we judge to be wise and honourable, and to devote our
          energies to the task of serving him to the best of our ability."

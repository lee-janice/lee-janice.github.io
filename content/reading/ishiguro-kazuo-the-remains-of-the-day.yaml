    - item:
      quote: "For all my lack of enthusiasm for the Hayes Society, it is my belief that
          this particular pronouncement at least was founded on a significant truth. If
          one looks at these persons we agree are ‘great’ butlers, if one looks at, say,
          Mr Marshall or Mr Lane, it does seem to me that the factor which distinguishes
          them from those butlers who are merely extremely competent is most closely captured
          by this word ‘dignity’.\n Of course, this merely begs the further question:
          of what is ‘dignity’ comprised?"
      description:
      chapter_title: "Chapter 1 - Day One · Evening: Salisbury"
      chapter_number:
      progress: 0.150838
      page_number:
      notes:
      favorite:
      tags: []
    - item:
      quote: "We may now understand better, too, why my father was so fond of the story
          of the butler who failed to panic on discovering a tiger under the dining table;
          it was because he knew instinctively that somewhere in this story lay the kernel
          of what true ‘dignity’ is. And let me now posit this: ‘dignity’ has to do crucially
          with a butler’s ability not to abandon the professional being he inhabits."
      description:
      chapter_title: "Chapter 1 - Day One · Evening: Salisbury"
      chapter_number:

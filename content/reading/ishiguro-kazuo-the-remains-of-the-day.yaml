      quote: It is now some twenty minutes since the man left, but I have remained
          here on this bench to await the event that has just taken place – namely,
          the switching on of the pier lights. As I say, the happiness with which
          the pleasure-seekers gathering on this pier greeted this small event would
          tend to vouch for the correctness of my companion’s words; for a great
          many people, the evening is the most enjoyable part of the day. Perhaps,
          then, there is something to his advice that I should cease looking back so
          much, that I should adopt a more positive outlook and try to make the best
          of what remains of my day. After all, what can we ever gain in forever
          looking back and blaming ourselves if our lives have not turned out quite
          as we might have wished?

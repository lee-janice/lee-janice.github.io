          more enthusiastically. After all, when one thinks about it, it is not such a
          foolish thing to indulge in – particularly if it is the case that in bantering
          lies the key to human warmth.\n It occurs to me, furthermore, that bantering
          is hardly an unreasonable duty for an employer to expect a professional to perform.
          I have of course already devoted much time to developing my bantering skills,
          but it is possible I have never previously approached the task with the commitment
          I might have done. Perhaps, then, when I return to Darlington Hall tomorrow
          – Mr Farraday will not himself be back for a further week – I will begin practising
          with renewed effort. I should hope, then, that by the time of my employer’s
          return, I shall be in a position to pleasantly surprise him."

    - item:
      quote: "Is that indeed so?’ I said. And as I spoke, I was struck by the thought
          – the same thought as had struck me on numerous occasions of late in Mr Farraday’s
          presence – that some sort of witty retort was required of me. Indeed, the local
          people were now observing a polite silence, awaiting my next remark. I thus
          searched my imagination and eventually declared:\n ‘A local variation on the
          cock crow, no doubt.’\n At first the silence continued, as though the local
          persons thought I intended to elaborate further. But then noticing the mirthful
          expression on my face, they broke into a laugh, though in a somewhat bemused
          fashion. With this, they returned to their previous conversation, and I exchanged
          no further words with them until exchanging good nights a little while later."

    - item:
      quote: When the curtain rose on the next act of Moses' life, idealism was
          gone from the stage. In its place was an understanding that ideas—dreams—
          were useless without power to transform them into reality. Moses spent the
          rest of his life amassing power, bringing to the task imagination, iron
          will and determination. And he was successful.
